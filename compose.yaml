services:
  almond:
    build:
      context: .
      args:
        # Override only when the DeepWuKong runtime image has a different tag.
        BASE_IMAGE: ${DEEPWUKONG_IMAGE:-deepwukong-rtx5060-cu128:experimental}
    image: t17a-almond:latest
    ports:
      - "8000:8000"
    gpus: all
    volumes:
      # Keep live Quick Demo outputs after the one-off container is removed.
      - ./outputs:/repo/outputs
    # Use `docker compose run`, not `up`, so this console owns the terminal.
    command: console
    stdin_open: true
    tty: true
    init: true
